name: Desktop CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            label: Windows-x64
          - os: macos-14
            label: Mac-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: minimal
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt pytest==8.4.2 pyinstaller==6.16.0
      - name: Run regression tests
        run: python -m pytest -q --junitxml=test-results.xml
      - name: Build native application
        run: python build_app.py
      - name: Run native application and GUI smoke checks
        run: python tools/smoke_native.py --dist dist --output native-validation
      - name: Package application, source and licenses
        run: python tools/package_release.py --dist dist --output release --smoke native-validation/SMOKE_TEST.json
      - name: Upload distributable archives
        uses: actions/upload-artifact@v4
        with:
          name: MouseLimbLab-${{ matrix.label }}
          path: release/
          compression-level: 0
          if-no-files-found: error
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Evidence-${{ matrix.label }}
          path: |
            native-validation/
            test-results.xml
